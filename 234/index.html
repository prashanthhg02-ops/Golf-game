<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Links — Mini Golf</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f5e9;
      --muted: #b7c9b8;
      --panel: rgba(15, 47, 39, .82);
      --lime: #d7f26a;
      --line: rgba(235, 248, 224, .16);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 34px;
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(86, 145, 95, .34), transparent 55%),
        linear-gradient(145deg, #102d27, #091a1a 72%);
    }

    .game {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 2px 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--lime);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -.065em;
      line-height: 1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .course-tag {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #e4efce;
      background: rgba(255,255,255,.045);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .scorebar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .score {
      min-height: 68px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .score strong {
      display: block;
      margin-top: 2px;
      font-size: 1.35rem;
      letter-spacing: -.04em;
    }

    .course-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(226, 249, 203, .24);
      border-radius: 20px;
      background: #537f4d;
      box-shadow: 0 24px 70px rgba(0,0,0,.33), 0 0 0 6px rgba(255,255,255,.025);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 5 / 3;
      touch-action: none;
      cursor: crosshair;
    }

    .message {
      position: absolute;
      top: 16px;
      left: 50%;
      max-width: calc(100% - 28px);
      padding: 9px 15px;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: white;
      background: rgba(11, 34, 29, .78);
      backdrop-filter: blur(8px);
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .message.hidden { opacity: 0; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 13px;
    }

    .help {
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.5;
    }

    .help b { color: #f2f5df; }

    .buttons { display: flex; gap: 9px; }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255,255,255,.07);
      font: inherit;
      font-size: .85rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover { transform: translateY(-1px); background: rgba(255,255,255,.13); }
    button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    button.primary { color: #20321d; border-color: var(--lime); background: var(--lime); }
    button.primary:hover { background: #e2ff83; }
    button:disabled { opacity: .42; cursor: default; transform: none; }

    @media (max-width: 620px) {
      body { padding: 20px 12px 26px; }
      header { align-items: start; }
      .course-tag { margin-top: 5px; padding: 8px 10px; font-size: .65rem; }
      .scorebar { gap: 6px; }
      .score { min-height: 60px; padding: 9px 10px; border-radius: 11px; }
      .score span { font-size: .59rem; letter-spacing: .08em; }
      .score strong { font-size: 1.12rem; }
      .course-wrap { border-radius: 13px; }
      .controls { align-items: start; flex-direction: column; }
      .buttons { width: 100%; }
      button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <p class="eyebrow">A tiny game of touch</p>
        <h1>Little Links</h1>
        <p class="subtitle">Take a breath. Find your line. Sink the putt.</p>
      </div>
      <div class="course-tag" id="courseName">Course 01</div>
    </header>

    <section class="scorebar" aria-label="Score">
      <div class="score"><span>Hole</span><strong id="holeScore">1 / 3</strong></div>
      <div class="score"><span>Strokes</span><strong id="strokeScore">0</strong></div>
      <div class="score"><span>Par</span><strong id="parScore">3</strong></div>
      <div class="score"><span>Total</span><strong id="totalScore">0</strong></div>
    </section>

    <div class="course-wrap">
      <canvas id="course" aria-label="Mini golf course. Drag back from the golf ball and release to shoot."></canvas>
      <div class="message" id="message">Drag back from the ball, then release to shoot.</div>
    </div>

    <div class="controls">
      <p class="help"><b>How to play:</b> Pull back from the ball to aim and set power. Release to putt. Avoid the water and roll into the cup.</p>
      <div class="buttons">
        <button id="restartButton" type="button">Restart hole</button>
        <button class="primary" id="nextButton" type="button" disabled>Next hole</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("course");
      const ctx = canvas.getContext("2d");
      const message = document.getElementById("message");
      const nextButton = document.getElementById("nextButton");
      const restartButton = document.getElementById("restartButton");
      const W = 1000;
      const H = 600;
      const bounds = { left: 34, right: 966, top: 34, bottom: 566 };

      const courses = [
        {
          name: "Meadow Bend", par: 3, start: { x: 125, y: 465 }, hole: { x: 858, y: 130 },
          sand: [{ x: 385, y: 90, w: 165, h: 125 }, { x: 520, y: 390, w: 190, h: 105 }],
          water: [{ x: 720, y: 300, r: 72 }],
          blocks: [{ x: 280, y: 265, w: 34, h: 150 }, { x: 600, y: 190, w: 145, h: 30 }]
        },
        {
          name: "Pond Path", par: 4, start: { x: 120, y: 120 }, hole: { x: 858, y: 465 },
          sand: [{ x: 175, y: 350, w: 190, h: 105 }, { x: 620, y: 105, w: 170, h: 110 }],
          water: [{ x: 475, y: 285, r: 94 }, { x: 775, y: 310, r: 48 }],
          blocks: [{ x: 340, y: 100, w: 32, h: 155 }, { x: 590, y: 390, w: 155, h: 28 }]
        },
        {
          name: "Pine Pocket", par: 3, start: { x: 125, y: 300 }, hole: { x: 855, y: 300 },
          sand: [{ x: 240, y: 90, w: 110, h: 150 }, { x: 650, y: 360, w: 120, h: 150 }],
          water: [{ x: 500, y: 300, r: 77 }],
          blocks: [{ x: 355, y: 80, w: 32, h: 205 }, { x: 610, y: 315, w: 32, h: 205 }]
        }
      ];

      let courseIndex = 0;
      let strokes = 0;
      let totalStrokes = 0;
      let ball;
      let dragging = false;
      let pointer = null;
      let holed = false;
      let lastTime = 0;

      function currentCourse() { return courses[courseIndex]; }

      function loadCourse(index, keepTotal) {
        courseIndex = index;
        const course = currentCourse();
        ball = { x: course.start.x, y: course.start.y, vx: 0, vy: 0, r: 12 };
        strokes = 0;
        holed = false;
        dragging = false;
        pointer = null;
        nextButton.disabled = true;
        nextButton.textContent = index === courses.length - 1 ? "Finish round" : "Next hole";
        document.getElementById("courseName").textContent = course.name;
        document.getElementById("holeScore").textContent = `${index + 1} / ${courses.length}`;
        document.getElementById("parScore").textContent = course.par;
        document.getElementById("strokeScore").textContent = "0";
        document.getElementById("totalScore").textContent = keepTotal ? totalStrokes : "0";
        showMessage("Drag back from the ball, then release to shoot.");
      }

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      function hideMessage() { message.classList.add("hidden"); }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.width * (H / W) * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.width / W, 0, 0);
      }

      function toWorld(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * W / rect.width,
          y: (event.clientY - rect.top) * W / rect.width
        };
      }

      function roundedRect(x, y, w, h, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      }

      function drawCourse() {
        const c = currentCourse();
        ctx.clearRect(0, 0, W, H);

        const turf = ctx.createLinearGradient(0, 0, W, H);
        turf.addColorStop(0, "#83a95d");
        turf.addColorStop(.52, "#729d55");
        turf.addColorStop(1, "#608b4c");
        ctx.fillStyle = turf;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = .12;
        for (let y = 44; y < H; y += 42) {
          ctx.fillStyle = Math.floor(y / 42) % 2 ? "#d7ed9f" : "#274e39";
          ctx.fillRect(bounds.left, y, bounds.right - bounds.left, 21);
        }
        ctx.restore();

        ctx.strokeStyle = "rgba(244, 246, 202, .58)";
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 10]);
        ctx.strokeRect(bounds.left, bounds.top, bounds.right - bounds.left, bounds.bottom - bounds.top);
        ctx.setLineDash([]);

        c.sand.forEach((s, i) => {
          ctx.fillStyle = "#d5c58b";
          ctx.beginPath();
          ctx.roundRect(s.x, s.y, s.w, s.h, 32);
          ctx.fill();
          ctx.save();
          ctx.clip();
          ctx.globalAlpha = .18;
          ctx.strokeStyle = "#816d42";
          ctx.lineWidth = 2;
          for (let x = s.x - s.h; x < s.x + s.w; x += 16) {
            ctx.beginPath();
            ctx.moveTo(x, s.y);
            ctx.lineTo(x + s.h, s.y + s.h);
            ctx.stroke();
          }
          ctx.restore();
        });

        c.water.forEach(w => {
          ctx.fillStyle = "#367e8a";
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(207, 240, 218, .58)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r - 8, .2, Math.PI * 1.85);
          ctx.stroke();
          ctx.fillStyle = "rgba(223, 246, 214, .18)";
          ctx.beginPath();
          ctx.ellipse(w.x - w.r * .2, w.y - w.r * .3, w.r * .37, w.r * .12, -.3, 0, Math.PI * 2);
          ctx.fill();
        });

        c.blocks.forEach(b => {
          roundedRect(b.x + 4, b.y + 6, b.w, b.h, 9, "rgba(27, 55, 37, .22)");
          roundedRect(b.x, b.y, b.w, b.h, 9, "#536e45");
          ctx.strokeStyle = "rgba(236, 239, 191, .45)";
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
        });

        drawFlag(c.hole);
        drawBall();
        drawAim();
      }

      function drawFlag(hole) {
        ctx.fillStyle = "rgba(20, 42, 30, .28)";
        ctx.beginPath();
        ctx.ellipse(hole.x + 4, hole.y + 5, 21, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#18241f";
        ctx.beginPath();
        ctx.ellipse(hole.x, hole.y, 19, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#f4efd5";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(hole.x, hole.y - 5);
        ctx.lineTo(hole.x, hole.y - 68);
        ctx.stroke();
        ctx.fillStyle = "#e66d58";
        ctx.beginPath();
        ctx.moveTo(hole.x + 1, hole.y - 66);
        ctx.lineTo(hole.x + 43, hole.y - 55);
        ctx.lineTo(hole.x + 1, hole.y - 43);
        ctx.closePath();
        ctx.fill();
      }

      function drawBall() {
        ctx.fillStyle = "rgba(18, 38, 28, .27)";
        ctx.beginPath();
        ctx.ellipse(ball.x + 3, ball.y + 6, ball.r * 1.15, ball.r * .72, 0, 0, Math.PI * 2);
        ctx.fill();
        const shine = ctx.createRadialGradient(ball.x - 4, ball.y - 5, 1, ball.x, ball.y, ball.r + 2);
        shine.addColorStop(0, "#fffef3");
        shine.addColorStop(1, "#dce2d2");
        ctx.fillStyle = shine;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(45, 59, 43, .28)";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      function drawAim() {
        if (!dragging || !pointer) return;
        const dx = ball.x - pointer.x;
        const dy = ball.y - pointer.y;
        const length = Math.hypot(dx, dy);
        if (length < 3) return;
        const scale = Math.min(1, 155 / length);
        const pullX = dx * scale;
        const pullY = dy * scale;
        ctx.strokeStyle = "rgba(255, 255, 230, .85)";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + pullX * 1.55, ball.y + pullY * 1.55);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#eff68a";
        ctx.beginPath();
        ctx.arc(ball.x + pullX * 1.55, ball.y + pullY * 1.55, 5, 0, Math.PI * 2);
        ctx.fill();
        roundedRect(ball.x - 24, ball.y + 23, 48, 7, 4, "rgba(14, 37, 28, .5)");
        roundedRect(ball.x - 24, ball.y + 23, 48 * Math.min(1, length / 155), 7, 4, "#d7f26a");
      }

      function inSand(x, y) {
        return currentCourse().sand.some(s => x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h);
      }

      function circleRectCollision(x, y, r, rect) {
        const px = Math.max(rect.x, Math.min(x, rect.x + rect.w));
        const py = Math.max(rect.y, Math.min(y, rect.y + rect.h));
        const dx = x - px;
        const dy = y - py;
        return dx * dx + dy * dy < r * r;
      }

      function collide() {
        let hit = false;
        if (ball.x - ball.r < bounds.left) { ball.x = bounds.left + ball.r; ball.vx = Math.abs(ball.vx) * .72; hit = true; }
        if (ball.x + ball.r > bounds.right) { ball.x = bounds.right - ball.r; ball.vx = -Math.abs(ball.vx) * .72; hit = true; }
        if (ball.y - ball.r < bounds.top) { ball.y = bounds.top + ball.r; ball.vy = Math.abs(ball.vy) * .72; hit = true; }
        if (ball.y + ball.r > bounds.bottom) { ball.y = bounds.bottom - ball.r; ball.vy = -Math.abs(ball.vy) * .72; hit = true; }

        currentCourse().blocks.forEach(b => {
          if (!circleRectCollision(ball.x, ball.y, ball.r, b)) return;
          const prevX = ball.x - ball.vx * .016;
          const prevY = ball.y - ball.vy * .016;
          if (prevX + ball.r <= b.x || prevX - ball.r >= b.x + b.w) {
            ball.vx *= -.72;
            ball.x = prevX < b.x ? b.x - ball.r : b.x + b.w + ball.r;
          } else {
            ball.vy *= -.72;
            ball.y = prevY < b.y ? b.y - ball.r : b.y + b.h + ball.r;
          }
          hit = true;
        });
        if (hit && Math.hypot(ball.vx, ball.vy) > 12) {
          ball.vx *= .94;
          ball.vy *= .94;
        }
      }

      function update(dt) {
        if (holed || dragging) return;
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > 2) {
          const slow = inSand(ball.x, ball.y) ? 4.2 : 1.45;
          const damping = Math.exp(-slow * dt);
          ball.vx *= damping;
          ball.vy *= damping;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          collide();
        } else {
          ball.vx = 0;
          ball.vy = 0;
        }

        const c = currentCourse();
        const toCup = Math.hypot(ball.x - c.hole.x, ball.y - c.hole.y);
        if (toCup < 18 && Math.hypot(ball.vx, ball.vy) < 225) {
          ball.x = c.hole.x;
          ball.y = c.hole.y;
          ball.vx = 0;
          ball.vy = 0;
          holed = true;
          totalStrokes += strokes;
          document.getElementById("totalScore").textContent = totalStrokes;
          const delta = strokes - c.par;
          const result = delta <= -2 ? "Albatross!" : delta === -1 ? "Birdie!" : delta === 0 ? "Par!" : delta === 1 ? "Bogey!" : `${delta} over par`;
          showMessage(`${result} — ${strokes} ${strokes === 1 ? "stroke" : "strokes"}.`);
          nextButton.disabled = false;
          nextButton.textContent = courseIndex === courses.length - 1 ? "See results" : "Next hole";
        }

        const hazard = currentCourse().water.find(w => Math.hypot(ball.x - w.x, ball.y - w.y) < w.r - ball.r * .35);
        if (hazard && !holed) {
          ball.x = currentCourse().start.x;
          ball.y = currentCourse().start.y;
          ball.vx = 0;
          ball.vy = 0;
          strokes += 1;
          document.getElementById("strokeScore").textContent = strokes;
          showMessage("Splash! One-stroke penalty. Try a safer line.");
        }
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, .032);
        lastTime = time;
        update(dt);
        drawCourse();
        requestAnimationFrame(frame);
      }

      canvas.addEventListener("pointerdown", event => {
        if (holed || Math.hypot(ball.vx, ball.vy) > 3) return;
        const pos = toWorld(event);
        if (Math.hypot(pos.x - ball.x, pos.y - ball.y) > 38) return;
        dragging = true;
        pointer = pos;
        canvas.setPointerCapture(event.pointerId);
        hideMessage();
      });

      canvas.addEventListener("pointermove", event => {
        if (dragging) pointer = toWorld(event);
      });

      canvas.addEventListener("pointerup", () => {
        if (!dragging || !pointer) return;
        const dx = ball.x - pointer.x;
        const dy = ball.y - pointer.y;
        const length = Math.hypot(dx, dy);
        if (length > 8) {
          const power = Math.min(length, 155);
          const speed = 3.65 * power;
          ball.vx = dx / length * speed;
          ball.vy = dy / length * speed;
          strokes += 1;
          document.getElementById("strokeScore").textContent = strokes;
        }
        dragging = false;
        pointer = null;
      });

      canvas.addEventListener("pointercancel", () => {
        dragging = false;
        pointer = null;
      });

      restartButton.addEventListener("click", () => {
        totalStrokes = Math.max(0, totalStrokes - strokes);
        loadCourse(courseIndex, true);
      });

      nextButton.addEventListener("click", () => {
        if (!holed) return;
        if (courseIndex < courses.length - 1) {
          loadCourse(courseIndex + 1, true);
        } else {
          showMessage(`Round complete! ${totalStrokes} total strokes across ${courses.length} holes.`);
          nextButton.disabled = true;
          nextButton.textContent = "Round complete";
          restartButton.textContent = "Play again";
          restartButton.onclick = () => {
            totalStrokes = 0;
            restartButton.textContent = "Restart hole";
            restartButton.onclick = null;
            loadCourse(0, false);
          };
        }
      });

      window.addEventListener("resize", resize);
      resize();
      loadCourse(0, false);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
